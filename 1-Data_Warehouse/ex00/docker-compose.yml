services:
  postgres:
    image: postgres:16.4-alpine
    container_name: piscineds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${STUDENT_LOGIN:-your_login}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: piscineds
    ports:
      - "5432:5432" #CAMBIAR A 5432:5432 SI QUIERES USAR EL PUERTO POR DEFECTO! PUERTO ACTUALMENTE OCUPADO
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STUDENT_LOGIN:-your_login} -d piscineds"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dbeaver:
    image: dbeaver/cloudbeaver:26.1.4
    container_name: piscineds-dbeaver
    restart: unless-stopped
    ports:
      - "8978:8978"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dbeaver_data:/opt/cloudbeaver/workspace

volumes:
  postgres_data:
  dbeaver_data:
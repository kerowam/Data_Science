services:
  postgres:
    image: postgres:16.4-alpine
    container_name: piscineds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${STUDENT_LOGIN:-your_login}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: piscineds
    ports:
      - "5432:5432" #REVISAR SI ESTÁ EN USO
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STUDENT_LOGIN:-your_login} -d piscineds"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: